<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">

<h:head>
    <title>Api Reinf</title>
    <style>
        body {
            background: linear-gradient(135deg, #d1e7f9, #a6d4f2, #75c1eb);
            color: #37474f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .center-text {
            text-align: center;
        }

        .right-text {
            text-align: right;
        }

        .header-blue th {
            background: linear-gradient(135deg, #d1e7f9, #a6d4f2) !important;
            color: #37474f !important;
            border-bottom: 2px solid #75c1eb !important;
        }

        .button-blue {
            background: linear-gradient(335deg, #d1e7f9, #a6d4f2) !important;
            border: none;
            color: #37474f !important;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .button-blue:hover {
            background: linear-gradient(135deg, #75c1eb, #5aa3d8) !important;
            transform: scale(1.05);
        }

        .container {
            width: 97%;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .form-section {
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px; /* Espaço entre os botões */
            margin-bottom: 10px;
        }

        .data-table {
            margin-top: 20px;
        }

        .title-background {
            background: linear-gradient(135deg, #d1e7f9, #a6d4f2);
            padding: 5px;
            border-radius: 5px;
            color: #37474f;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .paginator {
            background-color: rgba(255, 255, 255, 0.85);
            border: none;
            color: #37474f;
        }

        .ui-datatable-header {
            background: linear-gradient(135deg, #d1e7f9, #a6d4f2);
            border-bottom: 2px solid #75c1eb;
            color: #37474f;
        }

        .ui-datatable .ui-datatable-data > tr {
            border-bottom: 1px solid #b0bec5;
        }

        .ui-datatable .ui-datatable-data > tr:hover {
            background-color: rgba(224, 242, 241, 0.85);
        }

        .ui-datatable .ui-state-active {
            background-color: #d1e7f9 !important;
        }

        .select-one-menu {
            width: 98.8%;
            border: 1px solid #d1e7f9;
            border-radius: 5px;
            background-color: #d1e7f9;
            color: #37474f;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</h:head>
<h:body>
    <div class="container">
        <h2 class="left-text title-background">API EFD-REINF - Gerenciador de Eventos </h2>
       
        <h:form>
            <p:messages id="messages" autoUpdate="true" closable="true"/>

            <div class="form-section">
                <p:selectOneMenu id="event" value="#{consultaBean.selectedEvent}" styleClass="select-one-menu" required="true" requiredMessage="Você deve selecionar um evento e carregar os dados.">
                    <f:selectItem itemLabel="Selecione um evento" itemValue="" />
                    <f:selectItems value="#{consultaBean.events}" />
                </p:selectOneMenu>
            </div>

            <div class="buttons">
                <p:commandButton value="Carregar Dados" action="#{consultaBean.filterData}" update="dataTable" process="@this event" styleClass="button-blue" />
                <p:commandButton value="Executar Programa" action="#{consultaBean.executeProgram}" process="@this event" update="messages" styleClass="button-blue" />
            </div>

<p:dataTable id="dataTable" value="#{consultaBean.filteredData}" var="item" emptyMessage="Não há dados disponíveis"
             styleClass="data-table" scrollable="true" scrollHeight="500" rows="20" paginator="true"
             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">

    <p:column headerText="Situação" styleClass="center-text" headerStyleClass="header-blue th" sortBy="#{item.evento}">
        <h:outputText value="#{item.evento}" />
    </p:column>

    <p:column headerText="Recolhedor" styleClass="center-text" headerStyleClass="header-blue th" sortBy="#{item.cnpj}">
        <h:outputText value="#{item.cnpj}" />
    </p:column>

    <p:column headerText="Período Apuração" styleClass="center-text" headerStyleClass="header-blue th" sortBy="#{item.dtFG}">
        <h:outputText value="#{item.dtFG}">
            <f:convertDateTime pattern="dd/MM/yyyy" />
        </h:outputText>
    </p:column>

    <p:column headerText="Natureza do Rendimento" styleClass="center-text" headerStyleClass="header-blue th" sortBy="#{item.natRend}">
        <h:outputText value="#{item.natRend}" />
    </p:column>

    <p:column headerText="Base de Cálculo" styleClass="right-text" headerStyleClass="header-blue th" sortBy="#{item.vlrBruto}">
        <h:outputText value="#{item.vlrBruto}">
            <f:convertNumber type="number" minFractionDigits="2" maxFractionDigits="2" groupingUsed="true" />
        </h:outputText>
    </p:column>

    <p:column headerText="Valor Receita" styleClass="right-text" headerStyleClass="header-blue th" sortBy="#{item.vlrAgreg}">
        <h:outputText value="#{item.vlrAgreg}">
            <f:convertNumber type="number" minFractionDigits="2" maxFractionDigits="2" groupingUsed="true" />
        </h:outputText>
    </p:column>

    <p:column headerText="Código DARF" styleClass="center-text" headerStyleClass="header-blue th" sortBy="#{item.codDarf}">
        <h:outputText value="#{item.codDarf}" />
    </p:column>

</p:dataTable>



        </h:form>
    </div>
</h:body>
</html>
